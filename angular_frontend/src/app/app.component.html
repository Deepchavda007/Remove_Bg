<h1 class="text-6xl font-bold text-center mt-28">Remove Image Background</h1>
<p class="text-center mt-4">Get a transparent background for any image.</p>
@if (isUploadPage) {

<div class="flex justify-center items-center mt-14 image-upload-section">
  <div class="svg-container flex gap-4 items-center">
    <i [innerHTML]="'line' | svg"></i>
    <div
      class="image-upload-container border-2 border-dashed border-gray-200 rounded-lg flex flex-col gap-1 p-12 items-center max-w-screen-lg shadow"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      [class.dragging]="isDragging"
    >
      <i [innerHTML]="'image' | svg"></i>
      <input
        type="file"
        (change)="onFileChange($event)"
        accept=".jpg, .jpeg, .png"
        class="hidden"
        #fileInput
      />
      <button hlmBtn class="mt-8 px-12" (click)="triggerFileInput(fileInput)">
        Upload Image
      </button>
      <span class="text-sm text-gray-500 pt-4"> Drag and drop an image </span>
    </div>
    <i [innerHTML]="'plus' | svg"></i>
  </div>
</div>

<div class="flex justify-center gap-4 mt-12 w-full">
  @for (profile of githubProfiles; track $index) {
  <button class="button" (click)="openProfile(profile)">
    <span class="button-background"></span>
    <span class="button-text">
      @if (profile?.avatar_url) {
      <img
        [src]="profile.avatar_url"
        [alt]="profile.login + '\'s GitHub Avatar'"
        class="w-10 h-10 rounded-full mr-4"
      />
      } @if (profile?.login) {
      <span class="text-lg">{{ profile.login }}</span>
      }
    </span>
  </button>
  }
</div>
} @else {
<div class="flex justify-center gap-4 mt-12">
  <div class="image-comparison">
    <div
      class="relative items-center bg-white border border-gray-100 rounded-lg shadow-md dark:bg-gray-800 dark:border-gray-800"
    >
      <div class="image-container">
        @if (isImageLoading) {
        <div
          role="status"
          class="absolute -translate-x-1/2 -translate-y-1/2 top-2/4 left-1/2"
        >
          <svg
            aria-hidden="true"
            class="inline w-10 h-10 text-gray-200 animate-spin dark:text-gray-600 fill-white"
            viewBox="0 0 100 101"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
              fill="currentColor"
            />
            <path
              d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
              fill="currentFill"
            />
          </svg>
        </div>
        } @else {
        <img
          [src]="beforeImageUrl"
          alt="Before"
          class="before-image"
          (error)="beforeImageUrl = '/images/no-image.png'"
        />
        <img
          #afterImage
          [src]="afterImageUrl"
          alt="After"
          class="after-image"
          (error)="afterImageUrl = '/images/no-image.png'"
        />
        <div
          #slider
          class="slider"
          [style.left.%]="sliderPosition"
          (mousedown)="onMouseDown($event)"
          (mousemove)="onMouseMove($event)"
          (mouseup)="onMouseUp()"
          (mouseleave)="onMouseUp()"
        >
          <div class="slider-button"></div>
        </div>
        }
      </div>
    </div>
    <input
      type="range"
      [value]="sliderPosition"
      (input)="onSliderChange($event)"
      min="0"
      max="100"
      step="0.1"
      class="range-input"
    />
  </div>
  @if (!isImageLoading) {
  <div class="image-download mt-36 ms-12">
    <div class="flex items-center space-x-4">
      <span>Rate this result</span>

      <button (click)="onLike()" class="flex items-center p-2">
        <i [innerHTML]="'like' | svg" [ngClass]="{ 'is-like': isLiked }"></i>
      </button>

      <button (click)="onDislike()" class="flex items-center p-2">
        <i
          [innerHTML]="'dislike' | svg"
          [ngClass]="{ 'is-dislike': isDisliked }"
        ></i>
      </button>

      <button (click)="onDelete()" class="flex items-center p-2">
        <i [innerHTML]="'trash' | svg"></i>
      </button>
    </div>
    <button hlmBtn class="px-8 m-12" (click)="downloadImage()">
      Download Image
    </button>
  </div>
  }
  <div class="flex items-end">
  </div>
</div>
}
